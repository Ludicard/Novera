name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Mismo motor que producción: hay consultas que SQLite acepta y PostgreSQL no.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novera
          POSTGRES_USER: novera
          POSTGRES_PASSWORD: novera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novera" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://novera:novera@localhost:5432/novera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  # Solo en push a main y si las pruebas pasan. La llave SSH del VPS solo puede ejecutar
  # deploy/deploy.sh (forced command en authorized_keys del usuario "novera").
  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Desplegar en el VPS
        run: ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
      - name: Comprobar la web pública
        if: vars.NOVERA_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.NOVERA_URL }}/salud/"
