{% for campo in form.visible_fields %}
<div class="campo {{ campo.name }}{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
{% endfor %}
{% for e in form.non_field_errors %}<div class="mensaje error">{{ e }}</div>{% endfor %}
